# Security headers - included in EVERY location that sets its own add_header
# (nginx does not inherit add_header into a location that declares any add_header).
#
# CSP: everything same-origin. The API and websocket go through this same origin (/api, /socket.io),
# fonts are self-hosted (@fontsource), no third-party scripts. If a project adds an external
# origin (analytics, CDN images, maps), extend the matching directive here - never use '*'.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "DENY" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
# Enable only when the site is served exclusively over HTTPS (usually set at the TLS proxy):
# add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
