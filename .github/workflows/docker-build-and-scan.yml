name: Docker build and scan
on:
  workflow_call:
    inputs:
      push:
        type: boolean
        default: false
permissions:
  contents: read
  packages: write
jobs:
  build-and-scan:
    name: build-and-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Tags: sha-<short> always; latest on main (the release branch - NOT the default branch, which is dev); vX.Y.Z on git tags.
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}

      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: runtime
          build-args: |
            VITE_API_BASE_URL=${{ vars.VITE_API_BASE_URL }}
            VITE_DEFAULT_LOCALE=${{ vars.VITE_DEFAULT_LOCALE }}
          push: false
          load: true
          tags: rt-fe:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true # a cache outage (HTTP 503 seen 2026-11-24) must not fail the build

      - name: Scan image (fails on fixable CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: rt-fe:ci
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Login to GHCR
        if: ${{ inputs.push }}
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Re-uses the GHA layer cache from the build step above (no full rebuild).
      - name: Push image
        if: ${{ inputs.push }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: runtime
          build-args: |
            VITE_API_BASE_URL=${{ vars.VITE_API_BASE_URL }}
            VITE_DEFAULT_LOCALE=${{ vars.VITE_DEFAULT_LOCALE }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
          cache-from: type=gha
