name: On pull request
on:
  pull_request:
    branches: [dev, main]
permissions:
  contents: read

# New commits on the same PR cancel the older run.
concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    uses: ./.github/workflows/verify.yml
    secrets: inherit

  docker:
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker-build-and-scan.yml
    with:
      push: false
