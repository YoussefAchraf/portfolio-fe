name: On main merge
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    uses: ./.github/workflows/verify.yml
    secrets: inherit

  docker:
    needs: verify
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker-build-and-scan.yml
    with:
      push: true
    secrets: inherit

  # Continuous deployment: Render rebuilds the static site from main only after verify AND docker passed
  # (a failed run keeps the current site). Secret RENDER_DEPLOY_HOOK_URL (Render dashboard > static site >
  # Settings > Deploy Hook) is set by terraform/tf-rtfe; without it this job only prints a notice.
  deploy:
    needs: [verify, docker]
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Render
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::notice::RENDER_DEPLOY_HOOK_URL is not set - Render was not redeployed (deploy manually or set the secret)."
            exit 0
          fi
          status=$(curl -sS -o /dev/null -w '%{http_code}' -X POST "$HOOK")
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "::error::Render deploy hook answered HTTP $status"
            exit 1
          fi
          echo "Render deploy triggered for $GITHUB_SHA"
